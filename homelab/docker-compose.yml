services:
  postgres:
    image: postgres:16-alpine
    container_name: evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  evolution-api:
    # 2.3.7 e a ultima linha estavel antes da ativacao por licenca introduzida em 2.4.0.
    # Tambem inclui correcoes de Baileys/WebSocket que evitam a falha de QR code nesta stack.
    image: evoapicloud/evolution-api:2.3.7
    container_name: evolution-api
    restart: unless-stopped
    ports:
      # Bind apenas em localhost — o Cloudflare Tunnel fará a exposição externa
      - "127.0.0.1:8080:8080"
    volumes:
      # Persiste as sessões do WhatsApp
      - evolution_instances:/evolution/instances
    env_file:
      - .env
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/', r => process.exit(0)).on('error', () => process.exit(1))\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app_net

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --url http://evolution-api:8080
    networks:
      - app_net
    depends_on:
      evolution-api:
        condition: service_healthy

volumes:
  evolution_instances:
    name: evolution_instances
  pgdata:
    name: evolution_pgdata

networks:
  app_net:
    name: cardapiozap_net
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
